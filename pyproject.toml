[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gpower-clone"
version = "0.1.0"
description = "CONTRACT.md 1.0.0 arayüzüyle anova-oneway güç analizi (YZM301 Teardown Sprint)"
requires-python = ">=3.14"
dependencies = ["scipy==1.18.0", "numpy==2.5.1"]

[project.optional-dependencies]
# MCP sunucusu (CONTRACT §7) ve kural tabanlı ajan (§8, LLM yok); CLI bunlara ihtiyaç duymaz.
mcp = ["mcp==2.3.0"]
agent = ["mcp==2.3.0"]
test = ["pytest==9.1.1", "mcp==2.3.0"]

[project.scripts]
gpower-clone = "gpower_clone.cli:main"
gpower-clone-mcp = "gpower_clone.mcp_server:main"
gpower-clone-agent = "gpower_clone.agent.cli:main"
gpower-clone-eval = "gpower_clone.agent.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "bonus: bonus modlar (compromise, criterion, sensitivity); zorunlu testlerden ayırmak için -m \"not bonus\"",
]
